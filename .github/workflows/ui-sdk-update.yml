name: UI SDK update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: Pull request base branch
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.base || 'main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11.20.0
      - run: npm ci
      - name: Update UI SDK
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ui-sdk-update.mjs
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Verify update
        id: verify
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          { npm ci && npx playwright install --with-deps chromium && npm run verify; } 2>&1 | tee verify.log
      - name: Compose PR body
        if: steps.diff.outputs.changed == 'true'
        env:
          BASE: ${{ inputs.base || 'main' }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          { cat ui-sdk-update-body.md; printf '\n\nVerify: %s\n' "$VERIFY_RESULT"; if [ "$VERIFY_RESULT" = failure ]; then printf '\n<details><summary>Verify output</summary>\n\n```text\n'; tail -200 verify.log; printf '\n```\n</details>\n'; fi; } > pr-body.md
      # The repo does not let GitHub Actions open pull requests (Moe, 2026-11-18).
      # The job pushes the update branch; Opus opens the PR from it.
      - name: Push the update branch
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base_sha=$(git rev-parse HEAD)
          paths="package.json package-lock.json .agents/skills/ui-sdk"
          # Keep the reviewed head when the base and the update are unchanged.
          if git fetch --quiet origin bot/ui-sdk-update 2>/dev/null \
            && [ "$(git rev-parse FETCH_HEAD^)" = "$base_sha" ] \
            && git diff --quiet FETCH_HEAD -- $paths; then
            echo "bot/ui-sdk-update already holds this update on the current base; nothing to push."
            exit 0
          fi
          git switch -c bot/ui-sdk-update
          git add $paths
          git commit -s -m "chore(deps): ui-sdk ${VERSION}"
          # The bot owns this branch and regenerates it from the base when the base or the release changes.
          git push --force-with-lease origin bot/ui-sdk-update
          {
            echo "## UI SDK ${VERSION}"
            echo
            echo "Branch \`bot/ui-sdk-update\` is pushed. Verify: ${VERIFY_RESULT}."
            echo "Open the PR by hand: \`gh pr create --head bot/ui-sdk-update --base main\` with pr-body.md."
            echo
            cat pr-body.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail the job when the update breaks verify
        if: steps.diff.outputs.changed == 'true' && steps.verify.outcome == 'failure'
        run: exit 1
