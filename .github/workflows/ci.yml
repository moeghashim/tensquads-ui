name: CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to verify
        required: true
        type: string
  push:
    branches: [main, "feat/v0.1-foundation"]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.branch || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve checked-out commit
        id: checkout-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/preview/package-lock.json
      - name: Use npm 11
        run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Check git dependency install
        run: npm run check:git-install
        env:
          GITHUB_SHA: ${{ steps.checkout-commit.outputs.sha }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
