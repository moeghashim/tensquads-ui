commands:
  test: "npm run check"
  lint: "npm run check"

# no-mistakes appends these trailers to commits made by its agent steps.
commit:
  trailers:
    - "Signed-off-by: Moe Ghashim <mohanadgh@gmail.com>"

ignore_patterns:
  - PLAN.md
  - AGENTS.md
  - dev/**

protected_paths:
  - PLAN.md
  - AGENTS.md
  - dev/**

document:
  instructions: |
    Do not edit PLAN.md, AGENTS.md, or any file under dev/.
    These files define approved scope and task boundaries. Report a gap instead of changing them.

# Open every PR against the milestone branch, never main (a PR against main
# makes the DCO app check the whole milestone history). Change at each milestone.
pr:
  base_branch: feat/v0.1-foundation

# Rewriting a commit strands the branch in gate custody (tasks 003 and 006).
review:
  instructions: |
    Never amend, reword, squash, rebase or otherwise rewrite existing commits.
    Add every fix as a new commit. Do not edit PLAN.md, AGENTS.md, dev/** or design/**.
